[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "snapshot_imager"
dynamic = ["version"]
description = "Snapshot imaging of radio interferometric visibilities using non-uniform FFTs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Tyler Cox", email = "tyler.a.cox@berkeley.edu"},
]
maintainers = [
    {name = "Tyler Cox", email = "tyler.a.cox@berkeley.edu"},
]
keywords = ["radio astronomy", "visibility", "imaging", "interferometry", "nufft", "HERA"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.23",
    "astropy>=5.0",
    "finufft>=2.2",
    "tqdm",
    "hera-calibration>=3.6",
]

[project.optional-dependencies]
# GPU acceleration via CuPy + cuFINUFFT (CUDA 12 wheels). For other CUDA
# versions, install the matching cupy-cudaXXx wheel and cufinufft manually.
gpu = [
    "cupy-cuda12x",
    "cufinufft>=2.2",
]
test = [
    "pytest>=7.0",
    "pytest-cov",
]
dev = [
    "snapshot_imager[test]",
    "pre-commit",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/HERA-Team/snapshot_imager"
Repository = "https://github.com/HERA-Team/snapshot_imager"
Issues = "https://github.com/HERA-Team/snapshot_imager/issues"

[tool.setuptools.packages.find]
include = ["snapshot_imager*"]

[tool.setuptools_scm]
# Version is derived from git tags (e.g. v0.2.0). Untagged commits get a
# ".devN+g<hash>" version. The fallback is used when git metadata is missing.
fallback_version = "0.0.0"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "gpu: tests that require a CUDA GPU with CuPy and cuFINUFFT installed",
]

[tool.coverage.run]
source = ["snapshot_imager"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# Lint-only (no enforced formatting): pyflakes, core pycodestyle errors,
# bugbear, pyupgrade, and NumPy-specific checks.
select = ["E4", "E7", "E9", "F", "B", "UP", "NPY"]
ignore = [
    "E741",  # `l`, `m`, `n` are standard direction-cosine names
]
